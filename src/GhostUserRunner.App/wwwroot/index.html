<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghost User Runner</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">LOCAL WINDOWS CONTROLLER</p><h1>Ghost User Runner</h1><p>Runs only on this PC. Emergency stop: <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Q</kbd>.</p></header><section class="controls"><label>Duration (hours)<input id="durationHours" type="number" min="8" max="168" step="0.5" value="8"></label><div><button id="runButton">Run simulation</button><button id="pauseButton" disabled>Pause</button><button id="stopButton" disabled>Stop</button></div><p id="message" aria-live="polite"></p></section><section class="grid"><article><span>State</span><strong id="state">Stopped</strong></article><article><span>Elapsed</span><strong id="elapsed">00:00:00</strong></article><article><span>Remaining</span><strong id="remaining">08:00:00</strong></article><article><span>Current activity</span><strong id="currentActivity">—</strong></article></section><section><h2>Last action</h2><p id="lastAction">No actions yet.</p><h2>Recent activity</h2><ol id="activityLog"></ol></section></main><script src="app.js"></script></body></html>
